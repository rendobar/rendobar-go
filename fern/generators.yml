# The generated core lives in internal/api and is never edited by hand.
# Regenerate: cd fern && fern generate --local --group go --force (CI does this on every spec change).
api:
  specs:
    - openapi: ./openapi.json
      # Generate only what the root package calls, so the module does not ship
      # clients for endpoints nobody can reach. Add an endpoint here with its public method.
      settings:
        filter:
          endpoints:
            - GET /jobs/types
            - GET /jobs/types/{type}/schema
            - POST /jobs
            - GET /jobs
            - GET /jobs/{id}
            - POST /jobs/{id}/cancel
            - GET /jobs/{id}/download
            - GET /account/capabilities
            - POST /billing/checkout/pro
groups:
  go:
    generators:
      - name: fernapi/fern-go-sdk
        version: 1.70.19
        output:
          location: local-file-system
          path: ../internal/api
        config:
          module:
            path: github.com/rendobar/rendobar-go/internal/api
          packageName: api
          clientName: Client
          # Wire tests need containers at test time. The shared conformance suite covers the same ground.
          enableWireTests: false
