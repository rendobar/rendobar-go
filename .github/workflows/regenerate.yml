name: regenerate
# Pulls the published spec from production every hour. Nothing happens unless it
# changed. The SDK only ever sees a spec that is already live, so it can never
# ship a method the API does not serve yet.
on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:
concurrency:
  group: regenerate
permissions:
  contents: write
  pull-requests: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the live spec
        id: spec
        run: |
          curl -sf https://api.rendobar.com/openapi.json -o /tmp/live.json
          # Until production serves the typed spec (SubmitAnyJob marks it), do nothing:
          # regenerating from an older document would undo the typed core.
          if ! python3 -c "import json,sys;sys.exit(0 if 'SubmitAnyJob' in json.load(open('/tmp/live.json')).get('components',{}).get('schemas',{}) else 1)"; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Production spec is not the typed one yet. Skipping."; exit 0; fi
          python3 -c "import json;json.dump(json.load(open('/tmp/live.json')),open('/tmp/live.norm.json','w'),indent=2,sort_keys=True)"
          python3 -c "import json;json.dump(json.load(open('fern/openapi.json')),open('/tmp/ours.norm.json','w'),indent=2,sort_keys=True)"
          if cmp -s /tmp/live.norm.json /tmp/ours.norm.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-go@v5
        if: steps.spec.outputs.changed == 'true'
        with:
          go-version: stable
      - name: Check the spec change for breaking changes
        id: breaking
        if: steps.spec.outputs.changed == 'true'
        run: |
          # Compare before fern/openapi.json is overwritten. A breaking change still
          # opens the PR, flagged, so a person decides; it never merges silently.
          set +e
          docker run --rm -v "$PWD:/a" -v /tmp:/t tufin/oasdiff:v1.38.0 breaking /a/fern/openapi.json /t/live.json --fail-on ERR | tee /tmp/breaking.txt
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" = "0" ]; then
            echo "title=fix: regenerate from the published spec" >> "$GITHUB_OUTPUT"
            echo "note=No breaking change in the spec." >> "$GITHUB_OUTPUT"
          elif [ "$code" = "1" ]; then
            echo "title=fix: regenerate from the published spec (BREAKING SPEC CHANGE)" >> "$GITHUB_OUTPUT"
            echo "note=BREAKING SPEC CHANGE: oasdiff reports breaking changes. Read them before merging." >> "$GITHUB_OUTPUT"
          else
            echo "oasdiff failed to run (exit $code)"; exit 1
          fi
      - name: Regenerate the core
        if: steps.spec.outputs.changed == 'true'
        run: |
          cp /tmp/live.json fern/openapi.json
          (cd fern && npx -y fern-api@5.224.0 generate --local --group go --force)
          # The generator writes its own module files and docs. This repo is one module.
          git rm -q --ignore-unmatch internal/api/go.mod internal/api/go.sum internal/api/README.md internal/api/CONTRIBUTING.md internal/api/reference.md
          rm -f internal/api/go.mod internal/api/go.sum internal/api/README.md internal/api/CONTRIBUTING.md internal/api/reference.md
          # The typed job params come from the same spec.
          go generate ./...
          go mod tidy && go build ./... && go vet ./...
      - name: Open the regeneration PR
        if: steps.spec.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.REGEN_TOKEN }}  # a token that triggers CI on the PR (GITHUB_TOKEN would not)
          branch: regenerate/spec
          commit-message: "fix: regenerate from the published spec"
          title: ${{ steps.breaking.outputs.title }}
          body: |
            The published OpenAPI document changed. CI runs the conformance scenarios before this can merge.

            ${{ steps.breaking.outputs.note }}
