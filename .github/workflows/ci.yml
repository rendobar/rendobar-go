name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "go.mod" tests the oldest Go this module claims to support.
        go: ["go.mod", "oldstable", "stable"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the breaking-change check compares with the last release tag
      - uses: actions/checkout@v4
        with:
          repository: rendobar/openapi
          path: .openapi
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
      - name: Start the conformance mock
        # The mock serves fern/openapi.json, the spec this core was generated from,
        # so a newer spec in rendobar/openapi cannot fail CI before the core is regenerated.
        run: |
          python3 -I .openapi/conformance/mock_server.py fern/openapi.json 4100 requests.jsonl > mock.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf -X POST http://127.0.0.1:4100/__reset; then echo "mock is up"; exit 0; fi
            sleep 0.5
          done
          echo "The conformance mock did not come up:"; cat mock.log; exit 1
      - run: go vet ./...
      - name: Generated types match fern/openapi.json
        run: go generate ./... && git diff --exit-code -- spec_gen.go webhooks/events_gen.go
      - name: staticcheck (hand-written packages; internal/api is generated)
        if: matrix.go == 'stable'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 . ./webhooks ./internal/cmd/...
      - name: Tests (conformance scenarios, webhook vectors, examples)
        # Scenarios C19 to C39 skip, loudly, against a mock without /__requests.
        # Set this to "1" once rendobar/openapi PR #2 (the new mock) merges, so a skip fails CI.
        env:
          RENDOBAR_CONFORMANCE_REQUIRE: "0"
        run: go test -count=1 ./...
      - name: Tests on a 32-bit platform (386)
        if: matrix.go == 'stable'
        run: GOARCH=386 go test -count=1 . ./webhooks
      - name: Breaking-change check against the last release
        if: matrix.go == 'stable'
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$last" ]; then echo "No release yet, nothing to compare with."; exit 0; fi
          apidiff="go run golang.org/x/exp/cmd/apidiff@v0.0.0-20261106192419-47ce03d25ef0"
          git worktree add -q /tmp/base "$last"
          (cd /tmp/base && $apidiff -m -w /tmp/base.api github.com/rendobar/rendobar-go)
          out=$($apidiff -m -incompatible /tmp/base.api github.com/rendobar/rendobar-go 2>&1 | grep -vE '^(go: |Ignoring internal)' || true)
          if [ -n "$out" ]; then echo "Incompatible API changes since $last:"; echo "$out"; exit 1; fi
      - name: Public-surface deny-list
        if: matrix.go == 'stable'
        run: python3 -I .openapi/scripts/deny_list.py
